# 依存の更新 PR を週1で作る。セキュリティ更新は cooldown の対象外（即時）。
# cooldown は公開直後の乗っ取りリリースを掴まないための待機日数。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
